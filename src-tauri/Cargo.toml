[package]
name = "road"
version = "0.1.0"
description = "Road — version desktop macOS"
authors = ["Regista"]
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la lib et le binaire
# (https://github.com/rust-lang/cargo/issues/8519).
name = "road_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
